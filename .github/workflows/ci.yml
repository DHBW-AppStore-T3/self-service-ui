name: Self-Service-UI CI/CD

# Replaces the upstream docker-image.yml (releases, :latest, chart push). Here a
# push to dev or main builds ONE image, tags it sha-<commit>, and hands its
# digest to the deployment repository: dev -> staging, main -> prod.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: "Lint, test, build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # ci, not install: fails on a lockfile that disagrees with package.json.
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest
        if: '!cancelled()'
        run: npm test
      - name: Vite build
        if: '!cancelled()'
        run: npm run build

  security:
    name: "Trivy (filesystem)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,helm-chart
          exit-code: 1

  image:
    name: "Image: build, scan, push"
    runs-on: ubuntu-latest
    needs: [checks, security]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: name
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build (amd64, loaded for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ssu:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ssu:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the k3s node is x86_64. Same layers as above, so this is
      # cache hits plus the push.
      - name: Push
        id: push
        if: >-
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
          github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha

  # The deployment repo pins the image just pushed by its digest in
  # k8s/images/<staging|prod>.yaml (k8s-bump.yml: a commit on dev, a PR on main);
  # Argo CD of that environment follows.
  k8s-rollout:
    name: "Roll out on k8s"
    runs-on: ubuntu-latest
    needs: [image]
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      github.event_name != 'pull_request'
    steps:
      - name: Pin the new image in the deployment repo
        run: |
          gh workflow run k8s-bump.yml --repo DHBW-AppStore-T3/deployment --ref "$GITHUB_REF_NAME" \
            -f component=self-service-ui -f tag="sha-${GITHUB_SHA::7}" -f digest="$DIGEST"
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_PAT }}
          DIGEST: ${{ needs.image.outputs.digest }}
